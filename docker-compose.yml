services:
  app:
    build: .
    ports:
      - "8000:8000"
    # Settings come from the root .env (see .env.example); the image carries no env files.
    env_file: .env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_TYPE: ${DB_TYPE:-sqlite}
      SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
      REDIS_URL: redis://redis:6379
    # The SQLite file (the image sets SQLITE_DATABASE_URL to /data/sql_app.db).
    volumes:
      - app_data:/data
    depends_on:
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data

  # An optional Postgres for trying the postgres path. Start it with
  # `docker compose --profile local-db up` and point the app at it with DB_TYPE=postgres
  # and DB_HOST=db.
  db:
    image: postgres:16-alpine
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-latterboard}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  app_data:
  postgres_data:
  redis_data:
